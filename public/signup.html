<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Sign up for a free MEOK MCP API key — 200/day across 300+ MCPs</title>
<meta name=description content="Free API key for MEOK AI Labs' 300+ MCP servers — EU AI Act, DORA, NIS2, CRA, security, agent infrastructure. 200 calls/day free. Upgrade to Pro or pay-as-you-go.">
<meta name=robots content="index, follow">
<link rel=canonical href="https://proofof.ai/signup.html">
<meta property="og:title" content="Sign up — free MEOK MCP API key (200/day)">
<meta property="og:description" content="One form, 200 free calls/day across EU AI Act, DORA, NIS2, CRA + 300+ MCPs. No card required.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://proofof.ai/signup.html">
<style>body{font:16px/1.6 -apple-system,Segoe UI,Roboto,sans-serif;max-width:620px;margin:0 auto;padding:32px;color:#111}
h1{font-size:1.7em}.card{border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin:18px 0}
input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:1em;box-sizing:border-box}
button{background:#5b21b6;color:#fff;border:0;border-radius:8px;padding:12px 20px;font-size:1em;font-weight:700;cursor:pointer;margin-top:10px}
code{background:#f4f4f5;padding:2px 6px;border-radius:4px;word-break:break-all}.muted{color:#6b7280}.ok{color:#16a34a;font-weight:700}a{color:#5b21b6}</style></head><body>
<h1>Sign up — free MEOK MCP API key</h1>
<p class=muted>One key unlocks <strong>200 free calls/day</strong> across all 300+ MEOK AI Labs MCP servers — EU AI Act, DORA, NIS2, CRA, security, agent infrastructure. No card required.</p>
<div class=card>
  <form id=f><label>Work email<br><input type=email name=email required placeholder="you@company.com"></label>
  <button type=submit>Get my free key →</button></form>
  <div id=out></div>
</div>
<p class=muted>Need more? <a href="https://buy.stripe.com/aFa7sNcgAdQS0ZT1Uc8k91t">Pro — £199/mo (unlimited)</a> · <a href="/payg">Pay-as-you-go</a> · <a href="/scorecard/">See the scorecard</a> · <a href="/catalogue">Browse the catalogue</a></p>
<script>
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();
 const out=document.getElementById('out'); out.innerHTML='<p class=muted>Issuing…</p>';
 const email=e.target.email.value;
 try{const r=await fetch('/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
  const d=await r.json();
  if(d.ok){out.innerHTML='<p class=ok>✓ Your free key (200/day):</p><p><code>'+d.api_key+'</code></p><p class=muted>Set <code>MEOK_API_KEY</code> to this in your MCP client. Upgrade for unlimited: <a href="'+d.upgrade.compliance_pro_79_mo+'">Pro</a> or <a href="'+d.upgrade.pay_as_you_go+'">pay-as-you-go</a>.</p>';}
  else{out.innerHTML='<p style=color:#dc2626>'+(d.error||'error')+'</p>';}
 }catch(x){out.innerHTML='<p style=color:#dc2626>Network error — try again.</p>';}
});
</script></body></html>
