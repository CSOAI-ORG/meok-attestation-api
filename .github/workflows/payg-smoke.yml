name: PAYG E2E Smoke

permissions:
  issues: write

on:
  # Run every push to main + on PR
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # NO SCHEDULE. This ran daily at 06:30 UTC and opened a fresh issue every single time it
  # failed, which was every single day: meok-attestation-api.pages.dev does not resolve, because
  # the Pages project was never provisioned — cause #1 in this workflow's own alert text. A daily
  # alarm for a service that was never deployed is not monitoring. It produced #28 through #35 and
  # beyond, one per day, and that volume is part of why genuine signal elsewhere in this org sat
  # unread for days. Re-add the schedule when there is a deployed endpoint for it to watch.
  # Manual fire
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: PAYG E2E smoke against live production
        run: bash tools/smoke_test_payg_e2e.sh

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // Reuse the open alert if one exists. The previous version called issues.create()
            // unconditionally, so a persistent failure became one new issue per run rather than
            // one issue with a comment per run. Deduplicate on the label.
            const today = new Date().toISOString().split('T')[0];
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'payg-smoke-fail',
              per_page: 1,
            });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still failing on ${today}. Run: ${runUrl}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `PAYG smoke FAIL — ${today}`,
              body: `The daily PAYG E2E smoke test failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nLikely causes:\n- meok-attestation-api.pages.dev CF Pages project not yet provisioned\n- API env var (STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET) not configured on CF Pages\n- Worker Python rewrite not deployed\n- /payg/health endpoint not routing\n\nCheck /payg/health response body to localise.`,
              labels: ['payg-smoke-fail'],
            });
